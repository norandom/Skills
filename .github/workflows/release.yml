name: release

# Cut a release by pushing a version tag:
#   git tag v1.2.0 && git push origin v1.2.0
# Dagger builds the bundles in a container, then the artifacts are attached to
# a GitHub Release. The .skill / .mcpb bundles are not committed to the repo —
# this is where they are published.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Security gate: SkillSpector must pass before anything is built or published.
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: SkillSpector security gate
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.3"
          verb: call
          args: scan --nvidia-inference-key=env:NVIDIA_INFERENCE_KEY
        env:
          # Empty when the secret is unset -> the gate falls back to --no-llm.
          NVIDIA_INFERENCE_KEY: ${{ secrets.NVIDIA_INFERENCE_KEY }}

  release:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build release artifacts with Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.3"
          verb: call
          args: dist export --path=./dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          files: |
            dist/*.skill
            dist/*.mcpb
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
