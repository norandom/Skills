name: ClamAV

# Continuous ClamAV gate (malware). Runs the Dagger `malware` function the
# release workflow also gates on, so known-malware signatures are caught on
# PR / push instead of at tag time.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  clamav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: ClamAV malware scan
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.3"
          verb: call
          args: malware
