name: SkillSpector

# Continuous SkillSpector gate (skill vulnerabilities). Runs the Dagger `scan`
# function the release workflow also gates on, so a vulnerable skill is caught on
# PR / push instead of at tag time. On fork PRs the secret is absent and the scan
# runs static-only.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skillspector:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test scanner failure handling
        run: python3 .dagger/tests/test_scan_gate.py

      - name: Collect SkillSpector reports
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.3"
          verb: call
          args: scan-reports --anthropic-api-key=env:ANTHROPIC_API_KEY export --path=./scan-reports
        env:
          # Empty when the secret is unset -> the gate falls back to --no-llm.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload sanitized SkillSpector reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skillspector-reports
          path: scan-reports/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce SkillSpector verdict
        if: always()
        run: python3 .dagger/scripts/scan_reports.py check ./scan-reports
